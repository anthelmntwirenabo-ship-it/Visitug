<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uganda Tourism Management System</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f6f1;--sf:#fff;--tx:#17261c;--mu:#5a6a5f;--pr:#1f5130;--pt:#fff;--ac:#a8741a;--bd:#d6dcd4;--rd:#9b2c2c;--ug:#dfeadb;--nb:#ebece8;--wt:#c9dbe6;--bd2:#9aa59d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111912;--sf:#19231c;--tx:#e5ebe6;--mu:#98a79c;--pr:#5fa879;--pt:#0c150e;--ac:#d4a145;--bd:#2b3a30;--rd:#e08a8a;--ug:#233a2a;--nb:#1c261f;--wt:#1d313c;--bd2:#4a5a4f}}
:root[data-theme="dark"]{--bg:#111912;--sf:#19231c;--tx:#e5ebe6;--mu:#98a79c;--pr:#5fa879;--pt:#0c150e;--ac:#d4a145;--bd:#2b3a30;--rd:#e08a8a;--ug:#233a2a;--nb:#1c261f;--wt:#1d313c;--bd2:#4a5a4f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--pr);color:var(--pt);padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header h1{font-size:17px;margin:0;font-weight:650}header small{display:block;opacity:.8;font-weight:400;font-size:12px}
nav{display:flex;gap:4px;flex-wrap:wrap}nav button{background:transparent;color:var(--pt);border:1px solid transparent;padding:6px 12px;border-radius:5px;cursor:pointer;font:inherit;opacity:.85}nav button.on{background:var(--pt);color:var(--pr);opacity:1;font-weight:600}
main{max-width:1280px;margin:0 auto;padding:18px}
.ann{background:var(--sf);border-left:4px solid var(--ac);padding:9px 14px;margin-bottom:10px;border-radius:4px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px}@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:14px}.card+.card{margin-top:14px}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}.bar label,.form label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:5px;padding:7px 9px;min-width:0}textarea{width:100%;min-height:80px}
.btn{background:var(--pr);color:var(--pt);border:0;border-radius:5px;padding:7px 14px;cursor:pointer;font:inherit;font-weight:600}.btn.sec{background:transparent;color:var(--pr);border:1px solid var(--pr)}.btn.bad{background:var(--rd);color:#fff}.btn.sm{padding:4px 10px;font-size:13px}.btn:disabled{opacity:.4;cursor:default}
.item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd);cursor:pointer}.item:last-child{border:0}.item:hover h3{text-decoration:underline}.item .im{flex:0 0 96px;height:68px;border-radius:6px;overflow:hidden;background:var(--ug)}.im svg,.im img{width:100%;height:100%;object-fit:cover;display:block}
.item h3{margin:0;font-size:15px}.meta{color:var(--mu);font-size:13px}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid var(--bd);color:var(--mu);margin-right:4px;text-transform:uppercase;letter-spacing:.4px}.tag.utb{border-color:var(--ac);color:var(--ac);font-weight:700}.tag.ok{border-color:var(--pr);color:var(--pr)}.tag.no{border-color:var(--rd);color:var(--rd)}.tag.wait{border-color:var(--ac);color:var(--ac)}
#mapbox svg{width:100%;aspect-ratio:700/760;max-height:680px;display:block;background:var(--wt);border:1px solid var(--bd);border-radius:8px;touch-action:none;cursor:grab;user-select:none}
#mapbox path,#mapbox line{vector-effect:non-scaling-stroke}.gr{stroke:var(--bd);stroke-width:.6;opacity:.6}.nb{fill:var(--nb);stroke:var(--bd2);stroke-width:1}.ug{fill:var(--ug);stroke:var(--bd2);stroke-width:1}.ugb{fill:none;stroke:var(--pr);stroke-width:2.2}.wt{fill:var(--wt);stroke:var(--bd2);stroke-width:.6}
.mz{display:flex;gap:6px;margin-bottom:8px;align-items:center;flex-wrap:wrap}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.form .w{grid-column:1/-1}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);font-size:14px;vertical-align:top}th{color:var(--mu);font-weight:600;font-size:12px;text-transform:uppercase}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}.kpi .card{margin:0}.kpi b{font-size:24px;display:block;color:var(--pr)}
.bars div{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}.bars i{display:block;height:12px;background:var(--pr);border-radius:2px}
h2{font-size:18px;margin:0 0 10px}h4{margin:14px 0 6px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gal{display:flex;gap:8px;overflow-x:auto;margin:8px 0}.gal img,.gal svg{height:190px;width:auto;min-width:260px;border-radius:6px;flex:0 0 auto;object-fit:cover}
.pv{display:flex;gap:6px;flex-wrap:wrap}.pv img{height:64px;border-radius:4px}
</style>
</head>

 <div class="grid"><div class="card"><h2>Listings by region</h2>${bars(by("reg",REG))}<h2 style="margin-top:16px">Listings by category</h2>${bars(by("cat",CAT))}</div><div class="card"><h2>Newly verified vendors per day (last 14 days)</h2>${chart}<h2 style="margin-top:14px">Platform announcement</h2><div class="row"><input id="an" placeholder="Announcement text" style="flex:1"><button class="btn" data-act="ann">Publish</button></div>${M.ann.map((a,i)=>`<p class="meta">${E(a)} <a href="#" data-act="delann" data-v="${i}">remove</a></p>`).join("")}</div></div>
 <div class="card"><h2>Endorsement and compliance</h2><div class="row"><input id="eq" data-eq="1" placeholder="Search listing" value="${E(S.eq||"")}"></div><table id="et"></table></div>`}
function rEndorse(){const t=$("et");if(!t)return;const q=(S.eq||"").toLowerCase(),r=PUB.filter(l=>!q||l.name.toLowerCase().includes(q)).slice(0,15);t.innerHTML=`<tr><th>Listing</th><th>Category</th><th>Region</th><th>UTB badge</th></tr>`+r.map(l=>`<tr><td>${E(l.name)}</td><td>${CAT[l.cat]}</td><td>${REG[l.reg]}</td><td><button class="btn ${l.utb?"":"sec"} sm" data-act="endorse" data-k="${l.k}">${l.utb?"Endorsed - revoke":"Endorse"}</button></td></tr>`).join("")}
function render(){$("nav").innerHTML=Object.entries(ROLES).map(([k,v])=>`<button data-act="role" data-v="${k}" class="${S.role===k?"on":""}">${v}</button>`).join("");$("app").innerHTML={tourist,provider,admin,utb}[S.role]();
 if(S.role==="tourist"){rList();rMap();rDetail()}if(S.role==="provider"&&S.pTab==="form")rMap();if(S.role==="admin")rQueue();if(S.role==="utb")rEndorse()}

/* ===== Actions ===== */
const dsave=()=>{saveMeta()};
function addRows(rows,pre){let ok=0,bad=[];const out=[];rows.forEach((r,i)=>{const cat=Object.keys(CAT).find(k=>k===r.category||CAT[k].toLowerCase()===String(r.category).toLowerCase()),lat=+r.lat,lng=+r.lng;
  if(!r.name||!cat||isNaN(lat)||isNaN(lng)||!inUG(lng,lat)){bad.push(i+1);return}
  out.push(mk({name:r.name,cat,reg:REG[r.region]?r.region:regOf(lat,lng),dist:r.district||"",lat,lng,price:+r.price||0,lic:r.licence||"",owner:"bulk"}));ok++});
 DB.putMany("listings",out);return{ok,bad}}
function parseBulk(t){t=t.trim();if(t[0]==="[")return JSON.parse(t);return t.split(/\r?\n/).filter(Boolean).map(l=>{const c=l.split(",").map(s=>s.trim());return{name:c[0],category:c[1],region:c[2],district:c[3],lat:c[4],lng:c[5],price:c[6],licence:c[7]}})}
function demo(n){const A=["Pearl","Nile","Savanna","Crater","Rift","Lakeside","Highland","Sunrise","Kingfisher","Baobab","Equator","Mountain"],B={attr:["Viewpoint","Falls","Nature Reserve"],acc:["Lodge","Guesthouse","Camp"],food:["Kitchen","Cafe","Restaurant"],trans:["Safari Tours","Guides","Boat Cruises"],comm:["Crafts Collective","Coffee Tour","Dance Troupe"]},ks=Object.keys(CAT),out=[];
 while(out.length<n){const lng=29.6+Math.random()*5.3,lat=-1.45+Math.random()*5.7;if(!inUG(lng,lat))continue;const cat=ks[out.length%5],nm=A[Math.floor(Math.random()*12)]+" "+B[cat][Math.floor(Math.random()*3)];
  out.push(mk({name:nm,cat,reg:regOf(lat,lng),dist:"District "+(1+Math.floor(Math.random()*40)),lat,lng,price:Math.round(5+Math.random()*250),rating:+(3.4+Math.random()*1.6).toFixed(1),status:"approved",owner:"demo",published:Date.now()-Math.random()*30*DAY,created:Date.now()-31*DAY,checks:{reg:1,lic:1,id:1}}))}
 DB.putMany("listings",out)}
const L=k=>DB.s.listings.get(k);
document.addEventListener("click",async e=>{const t=e.target.closest("[data-act]");
 if(!t){const sv=e.target.closest("#mapbox svg");if(sv&&S.role==="provider"&&!S.moved){const r=sv.getBoundingClientRect(),W=700/S.z,H=760/S.z,lng=(S.cx*100-W/2+(e.clientX-r.left)/r.width*W)/100,lat=-(-S.cy*100-H/2+(e.clientY-r.top)/r.height*H)/100;S.pick={lat,lng};const f=n=>document.querySelector(`#pf [name=${n}]`);f("lat").value=lat.toFixed(4);f("lng").value=lng.toFixed(4);f("reg").value=regOf(lat,lng);rMap()}return}
 e.preventDefault();const a=t.dataset.act,k=t.dataset.k,v=t.dataset.v;let full=0;
 if(a==="role"){S.role=v;S.msg="";S.sel=null;full=1}
 else if(a==="sel"){S.sel=k||null;const l=L(k);if(l&&S.role==="tourist"){S.cx=l.lng;S.cy=l.lat;if(S.z<4)S.z=4}rMap();rDetail()}
 else if(a==="z"){if(v==="0"){S.z=1;S.cx=32.2;S.cy=1.4}else S.z=Math.min(60,Math.max(1,S.z*+v));rMap()}
 else if(a==="zoomc"){S.z=Math.min(60,S.z*2.2);S.cx=+t.dataset.x/100;S.cy=-t.dataset.y/100;rMap()}
 else if(a==="pg"){S.page+=+v;rList()}
 else if(a==="bm"||a==="trip"){const A=M[a==="bm"?"bm":"trip"],i=A.indexOf(k);i<0?A.push(k):A.splice(i,1);dsave();rList();rDetail()}
 else if(a==="near"){S.f.near=k;S.f.rad=30;S.sel=null;refresh();full=1}
 else if(a==="clear"){S.f={q:"",reg:"",cat:"",max:1000,min:0,near:"",rad:50,sort:"rating"};refresh();full=1}
 else if(a==="off"){try{localStorage.setItem("utms_offline",JSON.stringify(S.R.slice(0,500).map(l=>({n:l.name,c:l.cat,la:l.lat,ln:l.lng,d:l.dist}))));alert(Math.min(500,S.R.length)+" points saved on this device for offline reference.")}catch(x){alert("Offline storage is unavailable in this browser.")}}
 else if(a==="inq"){const m=$("iq").value.trim();if(m){M.inq.unshift({n:L(k).name,m,d:Date.now()});dsave();alert("Inquiry sent to the provider.")}}
 else if(a==="rev"){const m=$("rt").value.trim();if(m){const l=L(k);l.reviews.push({s:+$("rs").value,t:m});DB.put("listings",l);rList();rDetail()}}
 else if(a==="ptab"){S.pTab=v;S.msg="";full=1}
 else if(a==="gps"){navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{const la=p.coords.latitude,ln=p.coords.longitude,f=n=>document.querySelector(`#pf [name=${n}]`);f("lat").value=la.toFixed(4);f("lng").value=ln.toFixed(4);S.pick={lat:la,lng:ln};S.cx=ln;S.cy=la;S.z=Math.max(S.z,6);rMap()},()=>alert("GPS could not be read. Click the map or type the coordinates instead.")):alert("GPS is not available on this device.")}
 else if(a==="submit"){const g=n=>document.querySelector(`#pf [name=${n}]`).value.trim(),lat=parseFloat(g("lat")),lng=parseFloat(g("lng"));
  if(!g("name")||!g("dist")||!g("lic")||isNaN(lat)||isNaN(lng)){alert("Provide name, district, licence number and GPS coordinates.");return}
  if(!inUG(lng,lat)){alert("These coordinates fall outside Uganda. Pick the location on the map.");return}
  const l=mk({name:g("name"),cat:g("cat"),reg:g("reg"),dist:g("dist"),lat,lng,price:+g("price")||0,lic:g("lic"),desc:g("desc"),owner:"me",thumb:S.imgs[0]&&S.imgs[0].t,nimg:S.imgs.length,docs:[...document.querySelector("#pf [name=doc]").files].map(f=>f.name)});
  DB.put("listings",l);if(S.imgs.length)DB.put("img",{k:l.k,full:S.imgs.map(i=>i.f)});S.imgs=[];S.pick=null;log("Submission received: "+l.name);dsave();sync();S.pTab="mine";S.msg="Submission received. It stays private until the administration team verifies it.";full=1}
 else if(a==="insp"||a==="appr"||a==="rej"){const l=L(k),n=$("n"+k).value.trim();
  if(a==="appr"&&!(l.checks.reg&&l.checks.lic&&l.checks.id&&inUG(l.lng,l.lat))){alert("Complete all three checks and confirm the position is inside Uganda before approving.");return}
  if(a==="rej"&&!n){alert("A reason is required to reject a submission.");return}
  l.status={insp:"inspection",appr:"approved",rej:"rejected"}[a];if(a==="appr"){l.published=Date.now();l.rating=l.rating||4}if(n)l.notes.push(n);DB.put("listings",l);log(l.status+": "+l.name);dsave();sync();full=1}
 else if(a==="bappr"){let c=0;[...S.chk].forEach(id=>{const l=L(id);if(l&&l.status!=="approved"&&l.checks.reg&&l.checks.lic&&l.checks.id&&inUG(l.lng,l.lat)){l.status="approved";l.published=Date.now();l.rating=l.rating||4;DB.put("listings",l);c++}});S.chk.clear();log("Batch approval: "+c+" listings");dsave();sync();S.msg=c+" listings published. Selected items with incomplete checks were skipped.";full=1}
 else if(a==="apg"){S.aq.page+=+v;rQueue()}
 else if(a==="bulk"){try{const r=addRows(parseBulk($("bulk").value||"[]"));log("Bulk import: "+r.ok+" queued");dsave();sync();S.msg=r.ok+" vendors queued."+(r.bad.length?" Rejected rows: "+r.bad.slice(0,15).join(", ")+".":"");full=1}catch(x){$("bres").textContent="Could not read the batch. Check the format."}}
 else if(a==="demo"){demo(5000);log("Loaded 5,000 demo vendors");dsave();sync();S.msg="5,000 demo vendors loaded.";full=1}
 else if(a==="endorse"){const l=L(k);l.utb=!l.utb;DB.put("listings",l);log((l.utb?"Endorsed: ":"Revoked: ")+l.name);dsave();sync();rEndorse()}
 else if(a==="ann"){const m=$("an").value.trim();if(m){M.ann.unshift(m);dsave();full=1}}
 else if(a==="delann"){M.ann.splice(+v,1);dsave();full=1}
 if(full)render()});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.f==="q"){S.f.q=t.value;S.page=0;refresh();rList();rMap()}else if(t.dataset.aq==="q"){S.aq.q=t.value;S.aq.page=0;rQueue()}else if(t.dataset.eq){S.eq=t.value;rEndorse()}});
document.addEventListener("change",async e=>{const t=e.target;
 if(t.dataset.f){S.f[t.dataset.f]=t.type==="range"?+t.value:t.value;S.page=0;refresh();if(t.type==="range"||t.dataset.f==="near"){const l=S.f.near&&L(S.f.near);if(l&&t.dataset.f==="near"){S.cx=l.lng;S.cy=l.lat;S.z=Math.max(S.z,3.5)}render()}else{rList();rMap()}}
 else if(t.dataset.aq){S.aq[t.dataset.aq]=t.value;S.aq.page=0;rQueue()}
 else if(t.dataset.chk){const l=L(t.dataset.k);l.checks[t.dataset.chk]=t.checked?1:0;DB.put("listings",l)}
 else if(t.dataset.sel){t.checked?S.chk.add(t.dataset.sel):S.chk.delete(t.dataset.sel);rQueue()}
 else if(t.dataset.ph){S.imgs=[];for(const f of [...t.files].slice(0,6)){const full=await shrink(f,960,.72),th=await shrink(f,260,.6);if(full&&th)S.imgs.push({f:full,t:th})}$("pv").innerHTML=S.imgs.map(i=>`<img src="${i.t}" alt="">`).join("")}});
document.addEventListener("pointerdown",e=>{if(!e.target.closest("#mapbox svg"))return;S.drag={x:e.clientX,y:e.clientY,cx:S.cx,cy:S.cy};S.moved=false});
window.addEventListener("pointermove",e=>{const d=S.drag;if(!d)return;const dx=e.clientX-d.x,dy=e.clientY-d.y;if(Math.abs(dx)+Math.abs(dy)>5)S.moved=true;if(!S.moved)return;const el=$("mapbox"),u=700/S.z/el.clientWidth/100;S.cx=d.cx-dx*u;S.cy=d.cy+dy*u;rMapSoon()});
window.addEventListener("pointerup",()=>{S.drag=null;setTimeout(()=>S.moved=false,0)});
document.addEventListener("wheel",e=>{const sv=e.target.closest("#mapbox svg");if(!sv)return;e.preventDefault();const r=sv.getBoundingClientRect(),fx=(e.clientX-r.left)/r.width-.5,fy=(e.clientY-r.top)/r.height-.5,lng=S.cx+fx*7/S.z,lat=S.cy-fy*7.6/S.z;S.z=Math.min(60,Math.max(1,S.z*(e.deltaY<0?1.25:.8)));S.cx=lng-fx*7/S.z;S.cy=lat+fy*7.6/S.z;rMapSoon()},{passive:false});
window.addEventListener("resize",rMapSoon);

/* ===== Boot ===== */
(async()=>{await DB.init();const m=DB.s.meta.get("state");if(m)M=Object.assign(M,m);
 if(!DB.s.listings.size){const out=SEEDS.map((s,i)=>mk({k:"s"+i,name:s[0],cat:s[1],reg:s[2],dist:s[3],lat:s[4],lng:s[5],price:s[6],rating:s[7],utb:!!s[8],status:"approved",published:Date.now()-i*DAY*.7,checks:{reg:1,lic:1,id:1}})).concat(PEND.map((s,i)=>mk({k:"p"+i,name:s[0],cat:s[1],reg:s[2],dist:s[3],lat:s[4],lng:s[5],price:s[6],status:s[7],lic:"UTB-"+(1000+i)})));DB.putMany("listings",out);saveMeta()}
 sync();render()})();
</script>
</body>
